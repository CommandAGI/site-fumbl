<!doctype html>
<!-- The 1200×630 share card, rendered to ../og.png by redesign/render-og.py. -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../style.css">
<style>
body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--almond); color: var(--plum-ink); }
@media (prefers-color-scheme: dark) { body { background: #fff2e7; } }
.card { position: relative; width: 1200px; height: 630px; display: grid; grid-template-columns: 700px 1fr; align-items: center; padding: 0 0 0 64px; box-sizing: border-box; }
.t { font: 800 132px/0.86 "Bricolage"; font-stretch: 90%; letter-spacing: -0.04em; color: #4b2943; margin: 0; }
.t span { font-stretch: 75%; letter-spacing: -0.012em; }
.b { display: flex; align-items: center; gap: 12px; margin-top: 40px; font: 800 44px/1 "Bricolage"; font-stretch: 75%; color: #2e1629; letter-spacing: -0.035em; }
.b img { width: 46px; height: 46px; }
.s { font: 600 26px/1.2 "Figtree"; color: #4b2943; margin: 22px 0 0; }
.a { position: absolute; right: 56px; bottom: 0; width: 400px; height: 560px; border-radius: 50% 50% 0 0 / 38% 38% 0 0; overflow: hidden; }
.a img { width: 100%; height: 100%; object-fit: cover; }
.sun { position: absolute; left: 470px; bottom: -150px; width: 300px; height: 300px; border-radius: 50%; background: #f2a27c; }
</style></head>
<body><div class="card"><div><p class="t">It’s fine to <span>fumble.</span></p><p class="s">Dating for adults, safety first.</p><p class="b"><img src="../mark.svg" alt=""><img src="../wordmark.svg" alt="Fumbl" style="width:auto;height:44px"></p></div></div>
<div class="sun"></div><div class="a"><img src="../media/dusk.jpg" alt=""></div></body></html>
